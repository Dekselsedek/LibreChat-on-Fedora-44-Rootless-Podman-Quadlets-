version: "1.3.10"
cache: true
endpoints:
  google:
    apiKey: "${GOOGLE_API_KEY}"
    models:
      default: ["gemini-2.5-pro", "gemini-1.5-pro"]
      fetch: true
    # 2026 Feature: Toggle depth of reasoning (minimal, low, medium, high)
    thinkingLevel: "medium" 

  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default: ["moonshotai/kimi-k2.6", "deepseek/deepseek-r1"]
        fetch: true
      titleConvo: true
      modelDisplayLabel: "OpenRouter"
